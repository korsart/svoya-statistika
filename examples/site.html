<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка счётчика</title><script defer src="/site-stats/tracker.php"></script><style>body{max-width:700px;margin:60px auto;padding:20px;font:18px/1.7 sans-serif}button,a{margin:6px;padding:10px}#status{background:#eef3e8;padding:16px}</style></head><body><h1>Тестовый сайт</h1><p>Добавьте путь /test.html в настройки, затем разместите этот файл как /test.html. Данные этого примера смешаются с настоящей статистикой, поэтому проверяйте в отдельной установке или до запуска сайта.</p><button id="accept">Разрешить аналитику</button><button id="reject">Отказаться</button><button data-stats-revoke>Отозвать согласие</button><p><a href="https://t.me/example" target="_blank" rel="noopener">Тестовый переход в Telegram</a> <a href="tel:+70000000000">Телефон</a></p><button data-stats-event="cta">Целевая кнопка</button><button id="lead">Тест события успешной заявки</button><p id="status" aria-live="polite">Счётчик загружается.</p><p><a href="/site-stats/index.php">Открыть отчёт</a></p><script>window.addEventListener('DOMContentLoaded',()=>{const status=document.getElementById('status');const stats=window.SiteStats;if(!stats){status.textContent='Счётчик не загрузился. Проверьте путь, HTTPS и настройки.';return;}const show=()=>status.textContent=stats.isEnabled()?'Аналитика разрешена. Действия учитываются.':'Аналитика отключена. Действия не отправляются.';document.getElementById('accept').onclick=()=>{stats.consent(true);show();};document.getElementById('reject').onclick=()=>{stats.consent(false);show();};document.querySelector('[data-stats-revoke]').addEventListener('click',()=>setTimeout(show,0));document.getElementById('lead').onclick=()=>{const sent=stats.track('lead');status.textContent=sent?'Отправлено тестовое событие заявки, реальной формы здесь нет.':'Сначала разрешите аналитику и настройте эту страницу.';};show();});</script></body></html>
